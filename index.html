<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dongar Diaries — Expeditions &amp; Journeys</title>
    <meta name="description" content="Unforgettable road trips, high-altitude passes, and slow deliberate journeys across the Himalaya." />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Montserrat:wght@400;500;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('dongar-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- White paper behind the loader while the bundle downloads; React replaces it. -->
    <div id="root"><div style="position:fixed;inset:0;background:#fff"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
